name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check release versions and patch notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "Tag must start with v" >&2; exit 1 ;;
          esac
          test "$(tr -d '\r\n' < flatpak/VERSION)" = "$VERSION"
          test "$(node -p "require('./decky/package.json').version")" = "$VERSION"
          grep -Fq "## [$VERSION]" CHANGELOG.md
          test -s "docs/releases/$TAG.md"
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: VBAN Deck ${{ inputs.tag }} - Steam Deck / Linux
          draft: true
          body_path: docs/releases/${{ inputs.tag }}.md
