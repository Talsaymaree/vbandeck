name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.2.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*) echo "value=${TAG#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Tag must start with v" >&2; exit 1 ;;
          esac
      - name: Check release versions
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(tr -d '\r\n' < flatpak/VERSION)" = "$VERSION"
          grep -q "versionName '$VERSION'" android/app/build.gradle
          grep -q "\"version\": \"$VERSION\"" decky/package.json
          grep -q "## \[$VERSION\]" CHANGELOG.md

  android:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VBANDeck-Android-${{ needs.validate.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk

  draft:
    needs: [validate, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: VBANDeck-Android-${{ needs.validate.outputs.version }}
          path: release-assets
      - name: Name Android asset
        run: mv release-assets/app-release.apk release-assets/VBANDeck-Android-${{ needs.validate.outputs.version }}.apk
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## VBAN Deck ${{ needs.validate.outputs.version }}

            **Supported platforms:** Android, Steam Deck / Linux Flatpak, Steam Deck Game Mode (Decky Loader), and macOS.

            The signed Android APK is attached below. Build and attach the Flatpak, Decky ZIP, and signed/notarized macOS archive according to [the release guide](https://github.com/${{ github.repository }}/blob/main/docs/RELEASING.md), then publish this draft.
          files: release-assets/*
